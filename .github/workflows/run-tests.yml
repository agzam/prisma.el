name: Run Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['29.4', '30.1']
    steps:
      - name: Check out
        uses: actions/checkout@main

      - name: Cache nix store
        uses: actions/cache@v4
        with:
          path: /nix
          key: nix-${{ matrix.emacs-version }}

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: .elpa
          key: elpa-${{ matrix.emacs-version }}-${{ hashFiles('Makefile') }}

      - name: Install dependencies
        run: make deps

      - name: Run unit tests
        run: make test

      - name: Build tree-sitter grammars
        run: |
          git clone --depth 1 https://github.com/tree-sitter-grammars/tree-sitter-markdown.git /tmp/ts-md
          mkdir -p ~/.emacs.d/tree-sitter
          cc -shared -fPIC -O2 \
            -I /tmp/ts-md/tree-sitter-markdown/src \
            /tmp/ts-md/tree-sitter-markdown/src/parser.c \
            /tmp/ts-md/tree-sitter-markdown/src/scanner.c \
            -o ~/.emacs.d/tree-sitter/libtree-sitter-markdown.so
          cc -shared -fPIC -O2 \
            -I /tmp/ts-md/tree-sitter-markdown-inline/src \
            /tmp/ts-md/tree-sitter-markdown-inline/src/parser.c \
            /tmp/ts-md/tree-sitter-markdown-inline/src/scanner.c \
            -o ~/.emacs.d/tree-sitter/libtree-sitter-markdown-inline.so

      - name: Run E2E tests
        run: make test-e2e

      - name: Check byte-compilation
        run: make check-compile
